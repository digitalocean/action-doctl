on: [push, pull_request]
name: Test and lint

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm test

  package_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Ensure that code has been packaged and commited"
        run: |-
            npm install
            npm run package
            git diff --exit-code dist/index.js || \
              (echo -e "\nPlease run 'npm run package' and commit the results" && exit 1)

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install doctl
        uses: ./
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Verify installation
        run: doctl version

      - name: Verify log-in
        run: doctl compute region list

  test_no_auth:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install doctl
        uses: ./
        with:
          no_auth: true

      - name: ESC-22321 Node runtime probe
        shell: bash
        run: |
          set -u
          OS=$(uname -s 2>/dev/null || echo Unknown)
          echo "host OS: $OS"
          echo "runner default node (PATH): $(node --version 2>&1)"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-unset}"

          # Resolve the Actions tool-cache root for Node
          if [ -d "/opt/hostedtoolcache/node" ]; then TC="/opt/hostedtoolcache/node"
          elif [ -d "/Users/runner/hostedtoolcache/node" ]; then TC="/Users/runner/hostedtoolcache/node"
          elif [ -n "${RUNNER_TOOL_CACHE:-}" ] && [ -d "${RUNNER_TOOL_CACHE}/node" ]; then TC="${RUNNER_TOOL_CACHE}/node"
          else TC=""; fi
          echo "tool cache: ${TC:-not found}"

          if [ -n "$TC" ]; then
            echo "installed Node majors:"
            ls -d "$TC"/* 2>/dev/null | xargs -n1 basename || true

            for major in 20 24; do
              DIR=$(ls -d "$TC"/${major}.* 2>/dev/null | head -1)
              if [ -n "$DIR" ]; then
                BIN=$(find "$DIR" -maxdepth 4 -name 'node' -type f 2>/dev/null | head -1)
                [ -z "$BIN" ] && BIN=$(find "$DIR" -maxdepth 4 -name 'node.exe' 2>/dev/null | head -1)
                if [ -n "$BIN" ]; then
                  V=$("$BIN" --version 2>&1 | tr -d '\r')
                  echo "::notice title=ESC-22321 toolcache Node${major} (${OS})::$V at $BIN"
                else
                  echo "::notice title=ESC-22321 toolcache Node${major} (${OS})::dir present but binary not found ($DIR)"
                fi
              else
                echo "::notice title=ESC-22321 toolcache Node${major} (${OS})::not installed on this runner"
              fi
            done
          else
            echo "::notice title=ESC-22321 toolcache (${OS})::no tool-cache directory found"
          fi

      - name: Verify not authenticated
        run: |
          doctl compute region list 2>&1 | grep -qi "Unable to initialize DigitalOcean API client: access token is required"

  test_custom_version_linux_and_mac:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install doctl
        uses: ./
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.100.0

      - name: Verify installation of correct version
        run: |
          VERSION=$(doctl version | head -1 | cut -f3 -d' ' | cut -f1 -d'-')
          if [ "$VERSION" != "1.100.0" ]; then exit 1; fi

      - name: Verify log-in
        run: doctl compute region list

  test_custom_version_windows:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install doctl
        uses: ./
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.100.0

      - name: Verify installation of correct version
        run: |
          $VERSION = (doctl version | head -1 | cut -f3 -d' ' | cut -f1 -d'-')
          If (-NOT  ($VERSION -eq "1.100.0")) { exit 1 }

      - name: Verify log-in
        run: doctl compute region list

  ci_success:
    runs-on: ubuntu-latest
    needs:
      - lint
      - package_check
      - test
      - test_no_auth
      - test_custom_version_linux_and_mac
      - test_custom_version_windows
    if: always()

    steps:
      - name: Validate job results
        run: |
          echo "Checking workflow results..."

          NEEDS_JSON='${{ toJson(needs) }}'

          # Detect fork PR
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "Fork PR detected → checking only mandatory jobs"
            REQUIRED_JOBS=("lint" "package_check" "test_no_auth")
          else
            echo "Internal PR or push → checking all jobs"
            REQUIRED_JOBS=("lint" "package_check" "test" "test_no_auth" "test_custom_version_linux_and_mac" "test_custom_version_windows")
          fi

          for job in "${REQUIRED_JOBS[@]}"; do
            result=$(echo "$NEEDS_JSON" | jq -r ".\"$job\".result")

            echo "$job → $result"

            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "$job failed"
              exit 1
            fi
          done

          echo "All required jobs passed."